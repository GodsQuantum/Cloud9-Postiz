name: Prebuilt Postiz CLI Auth (upstream GitHub release)
on:
  push:
    branches: [main]
    paths:
      - "services/postiz-cli-auth/**"
      - ".github/workflows/postiz-cli-auth-ghcr.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/postiz-cli-auth/**"
      - ".github/workflows/postiz-cli-auth-ghcr.yml"
  schedule:
    - cron: "27 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: postiz-cli-auth-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-verify-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Privacy and generic image contract
        run: |
          set -euo pipefail
          python3 tests/privacy.py
          test -f services/postiz-cli-auth/Dockerfile
      - name: Fetch the official upstream application
        id: upstream
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/gitroomhq/postiz-agent.git postiz-agent
          sha="$(git -C postiz-agent rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          test -f postiz-agent/server/index.ts
          test -f postiz-agent/server/package.json
          grep -Fq "POSTIZ_OAUTH_CLIENT_ID" postiz-agent/server/index.ts
          grep -Fq "/device/callback" postiz-agent/server/index.ts
          grep -Fq "/device/token" postiz-agent/server/index.ts
          grep -Fq "/health" postiz-agent/server/index.ts
      - uses: docker/setup-buildx-action@v3
      - name: Compile on GitHub and load candidate
        run: |
          docker build --pull -f services/postiz-cli-auth/Dockerfile -t local/postiz-cli-auth:ci .
      - name: End-to-end HTTP smoke with disposable PostgreSQL and dummy OAuth
        run: |
          set -euo pipefail
          docker network create cli-auth-ci
          docker run -d --name cli-auth-pg --network cli-auth-ci             -e POSTGRES_DB=postiz -e POSTGRES_USER=postiz             -e POSTGRES_PASSWORD=ci-only-test             --health-cmd="pg_isready -U postiz -d postiz"             --health-interval=1s --health-retries=40 postgres:16-alpine
          for n in $(seq 1 50); do
            test "$(docker inspect --format '{{.State.Health.Status}}' cli-auth-pg)" = healthy && break
            sleep 1
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' cli-auth-pg)" = healthy
          docker run -d --name cli-auth-ci-app --network cli-auth-ci             -e DATABASE_URL=postgresql://postiz:ci-only-test@cli-auth-pg:5432/postiz             -e POSTIZ_OAUTH_CLIENT_ID=ci-only-public-placeholder             -e POSTIZ_OAUTH_CLIENT_SECRET=ci-only-public-placeholder             -e SERVER_URL=http://localhost:3111             -e POSTIZ_API_URL=http://localhost:3000             -e POSTIZ_FRONTEND_URL=http://localhost:3000             local/postiz-cli-auth:ci
          healthy=0
          for n in $(seq 1 50); do
            if test "$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' cli-auth-ci-app)" = healthy; then
              healthy=1
              break
            fi
            sleep 2
          done
          if test "$healthy" != 1; then docker logs --tail=100 cli-auth-ci-app; exit 1; fi
          docker run --rm --network cli-auth-ci --entrypoint node local/postiz-cli-auth:ci             -e 'const h=require("http");let done=0;for(const path of ["/health","/device/verify"]){h.get("http://cli-auth-ci-app:3111"+path,r=>{if(r.statusCode!==200)process.exit(2);r.resume();if(++done===2)console.log("POSTIZ_CLI_AUTH_HTTP_SMOKE_PASS")}).on("error",()=>process.exit(3))}'
          docker rm -f cli-auth-ci-app cli-auth-pg
          docker network rm cli-auth-ci
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified multiarchitecture rolling image on GitHub
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          ref="ghcr.io/godsquantum/cloud9-postiz-cli-auth"
          docker buildx build --pull --platform linux/amd64,linux/arm64             --label org.opencontainers.image.source="https://github.com/GodsQuantum/Cloud9-Postiz"             --label org.opencontainers.image.revision="${{ steps.upstream.outputs.sha }}"             --tag "$ref:sha-${{ steps.upstream.outputs.sha }}"             --tag "$ref:latest" --push             -f services/postiz-cli-auth/Dockerfile .
          echo "POSTIZ_CLI_AUTH_GHCR_LATEST_MULTIARCH_VERIFIED"
